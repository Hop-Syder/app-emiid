<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow-grad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 8" />

  <!-- Inner Glowing Circle -->
  <circle cx="256" cy="256" r="160" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#glow-grad)" stroke-width="8" filter="url(#glow)" />

  <!-- Dynamic Accent Arc -->
  <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />

  <!-- Center Identity Letter 'E' -->
  <text x="256" y="320" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="200" 
        font-weight="900" 
        fill="url(#text-grad)" 
        text-anchor="middle" 
        style="letter-spacing: -0.05em;">E</text>

  <!-- Small Tech Dot -->
  <circle cx="350" cy="190" r="12" fill="#ec4899" />
</svg>
